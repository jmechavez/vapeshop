name: Daily Telegram Report

on:
  schedule:
    # Run every hour to ensure we catch the right window even with delays.
    # The Go script will filter out the hours it doesn't want.
    - cron: '0 * * * *'

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Minimum permissions required
permissions:
  contents: read

jobs:
  send-report:
    name: Generate and Send Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download Go dependencies
        run: go mod download

      - name: Run Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Manila
        run: go run ./cmd/report