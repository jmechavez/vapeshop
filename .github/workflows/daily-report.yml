name: Daily Telegram Report

on:
  schedule:
    # Run every hour on the hour. The Go script will decide if it's the right time to send.
    - cron: '0 * * * *'

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Minimum permissions required
permissions:
  contents: read

jobs:
  send-report:
    name: Generate and Send Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Install Go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # Step 3: Verify Go installation
      - name: Verify Go version
        run: go version

      # Step 4: Download dependencies
      - name: Download Go dependencies
        run: go mod download

      # Step 5: Run the Telegram report
      - name: Run Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FORCE THE SCRIPT TO USE PHILIPPINE TIME
          TZ: Asia/Manila
        run: go run ./cmd/report