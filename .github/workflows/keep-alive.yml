name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -s https://driftculture-x7r1.onrender.com > /dev/null
